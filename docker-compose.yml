services:
  # 🗄️ PostgreSQL 데이터베이스 추가 (pgvector 포함)
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres-db
    environment:
      POSTGRES_DB: search_exchange_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: your_secure_password_123
    ports:
      - "5433:5432" # 다른 포트 사용
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d search_exchange_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 📊 pgAdmin (데이터베이스 관리 도구)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy

  # 🔍 Analysis Service
  analysis-service:
    build: ./services/analysis-service
    container_name: analysis-service
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://admin:your_secure_password_123@postgres:5432/search_exchange_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=models/gemini-flash-latest
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy

  # 🏪 Auction Service (Semantic Matching 지원)
  auction-service:
    build: ./services/auction_service
    container_name: auction-service
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://admin:your_secure_password_123@postgres:5432/search_exchange_db
      - REDIRECT_BASE_URL=${REDIRECT_BASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-models/gemini-flash-latest}
      # 시맨틱 매칭 설정 (선택적)
      - SEMANTIC_MATCH_LIMIT=50
      - SEMANTIC_SIM_THRESHOLD=0.72
      - SEMANTIC_WEIGHT=3.0
      - SEMANTIC_ONLY_MIN_SIM=0.75
      - SEMANTIC_ONLY_THRESHOLD=2.2
      - LOG_LEVEL=DEBUG
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy

  # 💰 Payment Service
  payment-service:
    build: ./services/payment-service
    container_name: payment-service
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://admin:your_secure_password_123@postgres:5432/search_exchange_db
      - JWT_SECRET_KEY=digisafe-super-secret-jwt-key-2024-production-ready-32-chars
      - JWT_ALG=HS256
      - JWT_ISSUER=digisafe-api
      - JWT_AUDIENCE=digisafe-client
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy

  # ✅ Verification Service
  verification-service:
    build: ./services/verification-service
    container_name: verification-service
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql://admin:your_secure_password_123@postgres:5432/search_exchange_db
      - SETTLEMENT_SERVICE_URL=http://settlement-service:8003
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy

  # 💰 Settlement Service (정산 서비스)
  settlement-service:
    build: ./services/settlement-service
    container_name: settlement-service
    ports:
      - "8008:8003"
    environment:
      - DATABASE_URL=postgresql://admin:your_secure_password_123@postgres:5432/search_exchange_db
      - JWT_SECRET_KEY=digisafe-super-secret-jwt-key-2024-production-ready-32-chars
      - JWT_ALG=HS256
      - JWT_ISSUER=digisafe-api
      - JWT_AUDIENCE=digisafe-client
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy

  # 👤 User Service
  user-service:
    build:
      context: ./services
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=postgresql://admin:your_secure_password_123@postgres:5432/search_exchange_db
      - JWT_SECRET_KEY=digisafe-super-secret-jwt-key-2024-production-ready-32-chars
      - JWT_ALG=HS256
      - JWT_ISSUER=digisafe-api
      - JWT_AUDIENCE=digisafe-client
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy

  # ✅ Quality Service
  quality-service:
    build:
      context: ./services
      dockerfile: quality-service/Dockerfile
    container_name: quality-service
    ports:
      - "8006:8006"
    environment:
      - DATABASE_URL=postgresql://admin:your_secure_password_123@postgres:5432/search_exchange_db
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy

  # 🏢 Advertiser Service
  advertiser-service:
    build: ./services/advertiser-service
    container_name: advertiser-service
    ports:
      - "8007:8007"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://admin:your_secure_password_123@postgres:5432/search_exchange_db
      - JWT_SECRET_KEY=digisafe-super-secret-jwt-key-2024-production-ready-32-chars
      - JWT_ALG=HS256
      - JWT_ISSUER=digisafe-api
      - JWT_AUDIENCE=digisafe-client
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - WEBSITE_ANALYSIS_SERVICE_URL=http://website-analysis-service:8009
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-models/text-embedding-004}
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy

  # 🌐 Website Analysis Service (AI 기반 웹사이트 분석)
  website-analysis-service:
    build:
      context: ./services/website-analysis-service
    container_name: website-analysis-service
    ports:
      - "8009:8009"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://admin:your_secure_password_123@postgres:5432/search_exchange_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=models/gemini-2.5-pro
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # 🌐 API Gateway
  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET_KEY=digisafe-super-secret-jwt-key-2024-production-ready-32-chars
      - JWT_ALG=HS256
      - JWT_ISSUER=digisafe-api
      - JWT_AUDIENCE=digisafe-client
      - PORT=8000
      - CORS_ALLOW_ORIGINS=http://localhost:3000
      - USER_SERVICE_URL=http://user-service:8005
      - ADVERTISER_SERVICE_URL=http://advertiser-service:8007
      - AUCTION_SERVICE_URL=http://auction-service:8002
      - PAYMENT_SERVICE_URL=http://payment-service:8003
      - SETTLEMENT_SERVICE_URL=http://settlement-service:8003
      - QUALITY_SERVICE_URL=http://quality-service:8006
      - ANALYSIS_SERVICE_URL=http://analysis-service:8001
      - VERIFICATION_SERVICE_URL=http://verification-service:8004
      - WEBSITE_ANALYSIS_SERVICE_URL=http://website-analysis-service:8009
    networks:
      - app-network
    depends_on:
      - user-service
      - advertiser-service
      - auction-service
      - payment-service
      - settlement-service
      - quality-service
      - analysis-service
      - verification-service
      - website-analysis-service

  # 🌐 Frontend
  frontend:
    build: .
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET_KEY=digisafe-super-secret-jwt-key-2024-production-ready-32-chars
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
      - API_GATEWAY_URL=http://api-gateway:8000
      - USER_SERVICE_URL=http://user-service:8005
      - ADVERTISER_SERVICE_URL=http://advertiser-service:8007
      - PAYMENT_SERVICE_URL=http://payment-service:8003
      - SETTLEMENT_SERVICE_URL=http://settlement-service:8003
      - ANALYSIS_SERVICE_URL=http://analysis-service:8001
      - AUCTION_SERVICE_URL=http://auction-service:8002
      - VERIFICATION_SERVICE_URL=http://verification-service:8004
      - QUALITY_SERVICE_URL=http://quality-service:8006
      - WEBSITE_ANALYSIS_SERVICE_URL=http://website-analysis-service:8009
    networks:
      - app-network
    depends_on:
      - api-gateway
      - analysis-service
      - auction-service
      - payment-service
      - settlement-service
      - verification-service
      - user-service
      - advertiser-service
      - quality-service
      - website-analysis-service

# 📦 볼륨 정의 (데이터 영구 보존용)
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

# 🌐 네트워크 정의
networks:
  app-network:
    driver: bridge
